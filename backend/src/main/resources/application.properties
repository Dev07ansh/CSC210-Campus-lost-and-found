spring.application.name=backend
spring.datasource.url=jdbc:sqlite:data/lostandfound.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
google.client-id=882163697172-d3d0e5hbog9sp23dcd1cmnvjgjd7o7of.apps.googleusercontent.com
# Email notifications are deliberately off until a server administrator configures
# SMTP through environment variables (SPRING_MAIL_HOST, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD, etc.). Do not add mail credentials to this file.
notifications.email.enabled=false
notifications.email.from=
# Comma-separated staff account emails. Configure this through CLAIMS_STAFF_EMAILS
# in the deployment environment; leave it empty locally until a staff account is chosen.
claims.staff-emails=${CLAIMS_STAFF_EMAILS:}
