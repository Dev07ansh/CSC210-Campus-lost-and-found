<template id="tpl-claim-card">
  <article class="claim-card">
    <div class="claim-card-top">
      <span class="claim-status claim-card-status"></span>
      <span class="muted claim-card-created"></span>
    </div>
    <h3><span class="claim-card-lost"></span><span class="claim-arrow" aria-hidden="true">→</span><span class="claim-card-found"></span></h3>
    <p class="claim-card-role"></p>
    <p class="claim-card-score"></p>
    <div class="claim-card-bottom">
      <button type="button" class="text-btn claim-card-view">View claim →</button>
    </div>
  </article>
</template>
