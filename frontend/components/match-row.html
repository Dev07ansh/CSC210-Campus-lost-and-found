<template id="tpl-match-row">
  <div class="match-row">
    <div>
      <strong class="match-title"></strong>
      <span class="match-meta"></span>
      <span class="match-context">Similarity is a suggestion, not proof of ownership.</span>
    </div>
    <div class="match-actions">
      <b class="match-score"></b>
      <button type="button" class="btn secondary match-claim">Claim this item</button>
    </div>
  </div>
</template>
