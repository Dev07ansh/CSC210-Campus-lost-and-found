<template id="tpl-item-card">
  <article class="item-card">
    <div class="item-image">
      <img class="card-img" hidden>
      <span class="card-placeholder"></span>
    </div>
    <div class="item-info">
      <div class="card-top">
        <span class="badge card-type"></span>
        <span class="muted card-date"></span>
      </div>
      <h3 class="card-title"></h3>
      <p class="card-meta"></p>
      <div class="card-bottom">
        <span class="status card-status"></span>
        <button class="text-btn card-view">View details →</button>
      </div>
    </div>
  </article>
</template>
