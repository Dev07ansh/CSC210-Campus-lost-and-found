<div class="page-intro">
  <span class="eyebrow">Search &amp; retrieval</span>
  <h2>Browse reports</h2>
  <p>Keyword, category, color, location, and date filters. <span id="browse-status"></span></p>
</div>
<div class="filter-bar">
  <input id="query" placeholder="Search item, category, or location" oninput="queueFilter()">
  <select id="type" onchange="filterItems()">
    <option value="">All types</option>
    <option>LOST</option>
    <option>FOUND</option>
  </select>
  <select id="category" onchange="filterItems()">
    <option value="">All categories</option>
  </select>
  <select id="color" onchange="filterItems()">
    <option value="">All colors</option>
  </select>
  <select id="location" onchange="filterItems()">
    <option value="">All locations</option>
  </select>
  <label class="filter-date-field">
    <input id="start" type="date" aria-label="Found report date — from" onchange="filterItems()">
    <span class="filter-date-hint" aria-hidden="true">Found date — from</span>
  </label>
  <label class="filter-date-field">
    <input id="end" type="date" aria-label="Found report date — to" onchange="filterItems()">
    <span class="filter-date-hint" aria-hidden="true">Found date — to</span>
  </label>
</div>
<p class="filter-date-note">This date range filters found reports only. Lost report dates are not currently filtered here.</p>
<p id="algorithm" class="dsa-note"></p>
<div id="results" class="item-grid"></div>
