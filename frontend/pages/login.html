<main class="auth-page">
  <div class="auth-brand"><div class="brand-mark">LF</div>Lost &amp; Found</div>
  <div class="auth-card">
    <span class="eyebrow">Campus platform</span>
    <h1>Welcome back</h1>
    <p>Sign in to manage reports and find items.</p>
    <div id="google-button" class="google-signin"></div>
    <div class="auth-divider"><span>or use demo sign-in</span></div>
    <p id="auth-message" class="auth-message"></p>
    <form onsubmit="handleAuth(event,'login')">
      <label>Email<input name="email" type="email" required></label>
      <label>Password<input name="password" type="password" required></label>
      <button class="btn primary full">Log in</button>
    </form>
    <div class="auth-switch">New here? <button class="text-btn" onclick="navigate('signup')">Create an account</button></div>
  </div>
</main>
