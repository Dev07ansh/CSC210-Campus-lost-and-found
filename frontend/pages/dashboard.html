<div class="hero">
  <div>
    <span class="badge neutral">Welcome back</span>
    <h2>Find it. Report it. Return it.</h2>
    <p>Report and retrieve lost or found campus items in one place.</p>
  </div>
  <div class="hero-actions">
    <button class="btn primary" onclick="navigate('report-lost')"><span class="button-plus" aria-hidden="true">+</span>Report Lost</button>
    <button class="btn secondary" onclick="navigate('report-found')"><span class="button-plus" aria-hidden="true">+</span>Report Found</button>
  </div>
</div>
<div class="search-hero">
  <div>
    <span class="eyebrow">Search retrieval</span>
    <h3>Looking for something?</h3>
  </div>
  <form class="search-row" onsubmit="searchHome(event)">
    <input id="home-search" type="search" placeholder="Search e.g. black wallet" aria-label="Search found items" />
    <button class="btn primary" type="submit">Search</button>
  </form>
</div>
<div class="stats">
  <div class="stat"><span>Active reports</span><strong id="stat-active"></strong></div>
  <div class="stat"><span>Found reports</span><strong id="stat-found"></strong></div>
  <div class="stat"><span>Lost reports</span><strong id="stat-lost"></strong></div>
</div>
<div class="section-heading">
  <h3>Recent reports</h3>
  <div>
    <span id="dashboard-status"></span>
    <button class="text-btn" onclick="navigate('browse')">View all →</button>
  </div>
</div>
<div class="item-grid" id="dashboard-grid"></div>
